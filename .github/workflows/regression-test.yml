name: Regression Test

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Lint check
        run: |
          ruff check anonymoustrace/

      - name: Type check
        run: |
          mypy anonymoustrace/
